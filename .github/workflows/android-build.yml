name: Android build

# Compiles the Capacitor Android app and produces a debug APK to download
# and sideload directly - this exists because this project's local dev
# machine (2 cores / ~3GB RAM) isn't enough to reliably run a Gradle build
# without running out of memory. Mirrors ios-build.yml's approach of
# building on a real CI runner instead of locally.
#
# The debug APK is signed with the default Android debug keystore, which
# is enough to sideload and test on a device with "install unknown apps"
# enabled - it is NOT suitable for the Play Store (that needs a real
# release signing key, added later as GitHub secrets once this is ready
# for that step).

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - "resources/js/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install JS dependencies
        run: npm install

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::Gradle failure tail"
            tail -n 150 /tmp/gradle-build.log
            echo "::endgroup::"
            # ::error:: commands are capped at ~10 per step, so only surface
            # the lines that actually explain what went wrong, not the full
            # stack trace noise.
            grep -E "FAILURE:|What went wrong|^> |Caused by:|error:|Exception" /tmp/gradle-build.log | tail -n 10 | while IFS= read -r line; do
              echo "::error::${line:0:400}"
            done
            exit "$status"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daha-shop-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
